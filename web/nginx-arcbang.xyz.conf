# bang.satloot.com —— BTCBANG · 比特宇宙（specs/btcbang-v1.md §六）
# 装到 /etc/nginx/sites-available/bang.satloot.com 并软链到 sites-enabled/
# 证书沿用本机自签（Cloudflare 回源 Full 模式），Cloudflare 上 *.satloot.com 已解析到本机，装上即生效。
# 照 web/nginx-bnbbang.com.conf 改，差异只有四处：
#   · server_name arcbang.xyz，root /var/www/arcbang（web/deploy-site-arc.sh 发这里）；
#   · deploy.html 走 /deploy-gate 门禁（09-17 加了 arc 版部署向导）；
#   · .hex 只放行 ArcUniverse / ArcMarket 两份部署字节码，其余 deny；
#   · 没有 www 段（bang.satloot.com 没有 www）。
# /api/、/s/、sitemap-s 反代到 127.0.0.1:8803 —— 与主站**同一个**服务端实例，它按 Host 判站
# （BNBBANG_BTC_HOSTS=bang.satloot.com）：/s/<n> 在这个域名上按比特币高度解释，在 bnbbang.com 上照旧按 BNB 区块。
# 真实 IP、缓存头、gzip 与主站逐字相同。

# 静态资源的缓存期（specs/seo-v1.md）：URL 里带内容指纹（?v=…）的一年 immutable ——
# 内容一变 URL 就变，缓存住旧的也命中不了；没指纹的（图标、OG 图、sitemap）给 1 小时。
# .html 与 config.js 仍然 no-cache，见下面各自的 location。map 必须在 http 上下文，
# sites-enabled 里的文件是 include 进 http{} 的，所以写在文件顶上正好。
# map 的变量名与主站那份不同（$arcbang_static_cc）：两份 conf 装在同一台 nginx 上，同名 map 会冲突。
map $args $arcbang_static_cc {
    default              "public, max-age=3600";
    ~(^|&)v=[0-9a-f]+    "public, max-age=31536000, immutable";
}

# arcbang.xyz —— ARCBANG（Arc 主网，只卖 NFT）。照 bang.satloot.com 的配法：
# Cloudflare 代理 + 自签回源证书（SSL 模式 Full），静态目录 /var/www/arcbang，API 实例走 8803。
# www 走 301 到裸域，别让两个域名各自被索引一份。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arcbang.xyz;
    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;
    return 301 https://arcbang.xyz$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arcbang.xyz;

    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;

    root /var/www/arcbang;
    index index.html;

    # 单文件 3.7 MB，不压就是 3.7 MB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html 默认就压，再列一次 nginx 会 warn
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 页面每次发布都会变，别让 Cloudflare 和浏览器缓存住旧的。
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # PWA 清单：Ubuntu 的 mime.types 没登记 .webmanifest，默认发 octet-stream，Chrome 会拒收。
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # config.js 决定整个站点连哪一个合约，**绝不能被缓存**（理由见主站 conf）。
    # 构建那边已经把内容指纹拼进了 URL（config.js?v=…），这里是第二道保险。
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 部署向导（web/deploy-arc.html → dist-arc/deploy.html，09-17）：与主站同一套门禁 ——
    # 服务端 /deploy-gate 按 BNBBANG_ADMIN_IPS 判：命中给向导，否则给公开的状态页。
    location = /deploy.html {
        proxy_pass http://127.0.0.1:8803/api/deploy-gate;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # 字节码：只放行向导要取的两份部署字节码（ArcUniverse / ArcMarket），其余 .hex 仍 403。
    # 字节码本身就在链上公开，放行只是让向导少一步手工粘贴。
    location ~ ^/(ArcUniverse|ArcMarket)\.bytecode\.hex$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~ \.hex$ {
        deny all;
    }

    # 让 $remote_addr 是真实访客 IP，而不是 Cloudflare 边缘
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 服务端 API：算 card、盖章（签名）、出图、/api/btc/*（比特币取块与铸造）。
    # 跑在本机 8802 —— 与 bnbbang.com **同一个实例**，它按 Host 判站，只从这里出去。
    location ^~ /api/ {
        # 结尾**不要加斜杠**：加了 nginx 会把 /api/ 前缀剥掉再转发，
        # 而 server/index.js 自己也做了一次 replace(/^\/api/, '')。
        proxy_pass http://127.0.0.1:8803;
        proxy_http_version 1.1;
        # Host 必须原样带过去：服务端靠它判「这是 bang.satloot.com」（/s/ 落地页、canonical、og 都按它选）
        proxy_set_header Host              $host;
        # $remote_addr 已经是 CF-Connecting-IP 解出来的真实访客。
        # **覆盖**客户端自带的 X-Real-IP —— 服务端 ipOf 只信被 nginx 盖过的这一头。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /btc/bang 要打比特币上游再打链上 RPC 再出图，慢的时候十几秒；60 秒足够且不至于挂死连接
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓存口径完全由服务端定（/bang 是 no-store，card/art 带版本号才 immutable）。nginx 不叠加缓存头。
        proxy_buffering on;
    }

    # 分享落地页（specs/broadcast-v2.md §2.2）：/s/<高度> 或 /s/<0x哈希>。
    # 服务端按 Host 判站：这个域名上 <高度> 按比特币高度解释（server/landing.js btc 变体）。
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8803;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # /s/ 落地页的 sitemap（server/seo.js）：/sitemap-s.xml 与分页 /sitemap-s-<k>.xml。
    # 由 8802 现生成（已铸造 + 精选名单，按 Host 出本站的），不在静态目录里；头与 /s/ 同一套。
    # **必须排在下面那条 .xml 静态正则之前**：正则按出现顺序匹配，排后面就被当静态文件 404 了。
    location = /sitemap-s.xml {
        proxy_pass http://127.0.0.1:8803;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    location ~ ^/sitemap-s-\d+\.xml$ {
        proxy_pass http://127.0.0.1:8803;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 静态资源缓存：带指纹一年，不带一小时（口径见文件顶上的 map）。
    # **/api/ 与 /s/ 必须是 ^~ 前缀**：nginx 里正则 location 优先于普通前缀 location，
    # 没有 ^~ 的话 /api/art/<hash>.png 会被这条正则截成静态文件 → 404（主站 2026-09-02 线上踩过）。
    # 排在 .html / config.js / .hex 那些 location 之后：精确匹配（=）总是先赢，
    # 正则按出现顺序，.hex 的 deny 在前面已经拦掉了。
    location ~* \.(js|css|webp|jpg|jpeg|png|svg|ico|webmanifest|xml|txt)$ {
        add_header Cache-Control $arcbang_static_cc;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
