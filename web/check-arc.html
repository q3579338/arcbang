<!-- 资格查询页（web/check-arc.html → dist-arc/check.html + en/check.html）
     2026-09-19：用户要一个「有没有白名单和先到先得」的查询入口 —— 任务页那一块层级提示
     只在**自己连上钱包并登记之后**才出现，别人想替朋友查、或者只想确认某个地址在不在名单里，
     在任务页上没有入口。这一页就是那个入口：输入地址，读 /api/allowlist/status，完事。

     三条口径，改这一页时别破：
       1. **不显示名次、不显示积分数字**。这是一个谁都能输入任意地址的公开页面，
          把别人的名次和分数摆在这里等于把整张榜按地址开放查询。层级、登记与否、
          阶段与开放时间是公开规则，可以说；名次和分数属于那个地址自己，去任务页看。
       2. **不承诺名额**。免费余量给的是链上读回来的实际剩余（服务端那一份缓存），
          合约里 887 这个硬上限公开可查，可以写；「前 100 名」「还剩几个白名单」一律不写。
       3. **只读，不签名**。「使用当前钱包」只调 eth_requestAccounts 取地址填进输入框，
          一次签名都不要 —— 查一下资格不该弹出签名窗。

     头部、令牌、导航与任务页（web/quest-arc.html）逐字一致：两页在同一条访问路径上，
     色差和字号差一眼就看得出来。**改令牌请两页一起改。**

     **文案里带换行的整段必须写成一行**：i18n 的词条 key 是「trim 之后逐字相等」，
     源码里换行加缩进会把文本节点里塞进 \n 和一串空格，词典就再也命中不了。 -->

<script>
/* ============================================================================
 * 资格查询页的行为：读一个地址的 /api/allowlist/status，铺一张结果卡。
 *
 * 一个链上读数都没有，一次签名都不要。免费余量也是服务端从它自己的缓存里给的 ——
 * 这一页不该因为公开 RPC 抖一下就变成半张白纸。
 *
 * **不显示名次、不显示积分**：接口回的 points / rank 一个都不读进 DOM。
 * ========================================================================== */
(function () {
  'use strict';
  var CFG = window.ARCBANG_CONFIG || {};
  var BASE = (CFG.apiBase != null ? CFG.apiBase : '/api').replace(/\/$/, '');
  var ADDR_RE = /^0x[0-9a-fA-F]{40}$/;

  function $(id) { return document.getElementById(id); }
  function T(zh) { return window.MirrorI18n ? window.MirrorI18n.t(zh) : zh; }
  function TF(zh) {
    var a = Array.prototype.slice.call(arguments, 1);
    return T(zh).replace(/\{(\d+)\}/g, function (m, i) { return a[i] == null ? m : a[i]; });
  }
  /* 阶段与层级的显示名与任务页逐字一致。**内部 key 不动**：
     服务端、合约、状态文件里一律还是 warmup / gtd / fcfs / public。 */
  var PHASE_CN = { warmup: '预热期', gtd: '白名单', fcfs: '先到先得', public: '公售' };
  var TIER_CN = { gtd: '白名单', fcfs: '先到先得' };

  function fmtWhen(iso) {
    if (!iso) return T('待定');
    var d = new Date(iso);
    if (isNaN(d.getTime())) return T('待定');
    /* 本地时间：访问者自己那一套时区与格式，比 UTC 串少一道心算。 */
    try { return d.toLocaleString(); } catch (e) { return iso; }
  }

  function msg(text, cls) {
    var el = $('msg');
    el.className = 'ab-msg ' + (cls || '');
    el.textContent = text || '';
  }

  function prov() { return (window.MirrorWallet && window.MirrorWallet.provider()) || window.ethereum || null; }

  /* ---------------- 结果卡 ---------------- */
  function render(addr, st) {
    var t = st.tier;                              // 'gtd' / 'fcfs' / null
    var k = (t === 'gtd' || t === 'fcfs') ? t : 'none';

    var tag = $('tierTag');
    tag.className = 'ab-tag ' + k;
    tag.textContent = T(TIER_CN[t] || '未获资格');

    var reg = $('regTag');
    reg.className = 'ab-tag ' + (st.registered ? 'on' : 'none');
    reg.textContent = st.registered ? T('已登记') : T('未登记');
    $('regGo').hidden = !!st.registered;

    $('rAddr').textContent = addr;
    $('rPhase').textContent = T(PHASE_CN[st.phase] || st.phase || '');

    /* 该层级能在哪一段铸：白名单 → 白名单阶段，先到先得 → 先到先得阶段，
       未获资格 → 公售阶段。开放时间缺省就是「时间待定」（服务端还没配）。 */
    var mine = t === 'gtd' ? 'gtd' : (t === 'fcfs' ? 'fcfs' : 'public');
    var opens = st.opens || {};
    var el = $('rOpen');
    /* 只改第一个文本节点，说明性的 .sub 原样留着（整块 innerHTML 重写会把结构冲掉）。 */
    if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = T(PHASE_CN[mine]);
    $('rOpenSub').textContent = TF('开放时间：{0}', fmtWhen(opens[mine]));

    /* 免费余量：链上还剩几枚。887 是合约里的硬上限，公开可查，写它不算承诺名额。 */
    $('rFree').textContent = (st.freeLeft == null ? '—' : st.freeLeft) + ' / 887';

    $('rSay').textContent = t === 'gtd'
      ? T('该地址为白名单，可在白名单阶段免费铸造 1 枚。')
      : t === 'fcfs'
        ? T('该地址为先到先得，可在先到先得阶段按剩余额度免费铸造。')
        : T('该地址未获资格，可在公售阶段付费铸造。');

    var frozen = !!(st.counts && st.counts.frozen);
    $('rFoot').textContent = frozen ? T('榜单已定格。')
      : T('查询结果为当前实时状态，预热结束定格榜单后为准。');

    $('result').hidden = false;
  }

  /* ---------------- 查询 ---------------- */
  var busy = false;
  function query(raw) {
    var addr = String(raw == null ? '' : raw).trim();
    if (!addr) { msg(T('请输入钱包地址'), 'err'); return; }
    if (!ADDR_RE.test(addr)) { msg(T('地址格式不正确'), 'err'); return; }
    if (busy) return;
    busy = true;
    $('btnQuery').disabled = true;
    msg(T('正在查询…'));
    fetch(BASE + '/allowlist/status?addr=' + encodeURIComponent(addr)).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (st) {
      busy = false;
      $('btnQuery').disabled = false;
      msg('');
      render(addr, st);
    }, function () {
      busy = false;
      $('btnQuery').disabled = false;
      $('result').hidden = true;
      msg(T('查询失败，请稍后重试'), 'err');
    });
  }

  $('btnQuery').addEventListener('click', function () { query($('addrIn').value); });
  $('addrIn').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); query($('addrIn').value); }
  });

  /* 「使用当前钱包」：只取地址填进输入框，**不签名**。查一下资格不该弹签名窗。 */
  $('btnWallet').addEventListener('click', function () {
    var p = prov();
    if (!p) { msg(T('未检测到钱包扩展'), 'err'); return; }
    msg('');
    p.request({ method: 'eth_requestAccounts' }).then(function (a) {
      var one = a && a[0];
      if (!one) { msg(T('未检测到钱包扩展'), 'err'); return; }
      $('addrIn').value = one;
      query(one);
    }, function (er) {
      msg(er && er.code === 4001 ? T('已在钱包中取消') : ((er && er.message) || String(er)), 'err');
    });
  });

  /* ?addr=0x… 直接查：别人把结果链接发给你时，打开就是那一张卡。 */
  (function () {
    var m = /[?&]addr=([^&]+)/.exec(location.search);
    if (!m) return;
    var a = '';
    try { a = decodeURIComponent(m[1]); } catch (e) { a = m[1]; }
    a = a.trim();
    if (!a) return;
    $('addrIn').value = a;
    query(a);
  })();
})();
</script>

</body>
</html>
